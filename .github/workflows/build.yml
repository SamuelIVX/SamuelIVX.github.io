---
name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build
